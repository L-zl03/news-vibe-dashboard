<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">淡墨远山</title>
  <desc id="desc">数重灰墨山峦隐入留白，水面、孤舟与飞鸟点缀其间。</desc>
  <defs>
    <linearGradient id="distant" x1="360" y1="90" x2="360" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#727272" stop-opacity=".18"/>
      <stop offset="1" stop-color="#BDBDBD" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="near" x1="470" y1="112" x2="470" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#282828" stop-opacity=".62"/>
      <stop offset=".5" stop-color="#787878" stop-opacity=".26"/>
      <stop offset="1" stop-color="#CFCFCF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="water" x1="50" y1="0" x2="610" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8A8A8A" stop-opacity="0"/>
      <stop offset=".5" stop-color="#8A8A8A" stop-opacity=".32"/>
      <stop offset="1" stop-color="#8A8A8A" stop-opacity="0"/>
    </linearGradient>
    <filter id="wash" x="-8%" y="-8%" width="116%" height="116%">
