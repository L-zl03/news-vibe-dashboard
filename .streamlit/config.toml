# Monochrome adaptation of the shadcn native Streamlit theme.
# All typography and colors use Streamlit's public theming API.
[server]
enableStaticServing = true

[theme]
base = "light"
primaryColor = "#262626"
backgroundColor = "#FAFAFA"
secondaryBackgroundColor = "#F0F0F0"
textColor = "#272727"
linkColor = "#363636"
linkUnderline = true
borderColor = "#DADADA"
codeTextColor = "#363636"
codeBackgroundColor = "#F0F0F0"
font = "serif"
headingFont = "Ink Editorial"
codeFont = "serif"
baseFontSize = 16
baseFontWeight = 400
codeFontSize = "0.95rem"
headingFontSizes = ["48px", "32px", "25px", "21px", "18px", "16px"]
headingFontWeights = [300, 300, 300, 300, 300, 300]
metricValueFontSize = "2rem"
metricValueFontWeight = 300
baseRadius = "2px"
buttonRadius = "2px"
showWidgetBorder = true
showSidebarBorder = true
paddingTop = "2.5rem"
paddingBottom = "3rem"
redColor = "#474747"
orangeColor = "#5B5B5B"
yellowColor = "#626262"
greenColor = "#505050"
blueColor = "#555555"
violetColor = "#595959"
grayColor = "#676767"
redBackgroundColor = "#EAEAEA"
orangeBackgroundColor = "#EFEFEF"
yellowBackgroundColor = "#EEEEEE"
greenBackgroundColor = "#ECECEC"
blueBackgroundColor = "#EFEFEF"
violetBackgroundColor = "#EFEFEF"
grayBackgroundColor = "#EFEFEF"
redTextColor = "#242424"
orangeTextColor = "#333333"
yellowTextColor = "#333333"
greenTextColor = "#333333"
blueTextColor = "#333333"
violetTextColor = "#333333"
grayTextColor = "#555555"
chartCategoricalColors = ["#252525", "#555555", "#808080", "#A6A6A6", "#C5C5C5"]

[[theme.fontFaces]]
family = "Ink Editorial"
url = "app/static/fonts/InkEditorial-Light.woff2"
weight = 300
style = "normal"

[theme.sidebar]
backgroundColor = "#F0F0F0"
secondaryBackgroundColor = "#E8E8E8"
textColor = "#333333"
borderColor = "#DADADA"
primaryColor = "#262626"
paddingTop = "2.5rem"
